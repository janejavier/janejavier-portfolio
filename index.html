<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- This puts your domain name directly onto the browser tab -->
    <title>janejavier.com | Test Site</title>
    <style>
        :root {
            --primary: #0284c7;
            --dark: #0f172a;
            --light: #f8fafc;
            --text: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            color: var(--text);
            line-height: 1.6;
            background-color: var(--light);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .test-card {
            background: #ffffff;
            max-width: 500px;
            width: 100%;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(15, 23, 42, 0.08);
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        .domain-badge {
            display: inline-block;
            background: #e0f2fe;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 20px;
            letter-spacing: 0.02em;
        }

        h1 {
            font-size: 2rem;
            color: var(--dark);
            margin-bottom: 15px;
            letter-spacing: -0.03em;
        }

        p {
            font-size: 1.1rem;
            color: #64748b;
            margin-bottom: 25px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #10b981;
            font-weight: 500;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        @media (max-width: 480px) {
            h1 { font-size: 1.6rem; }
            body { padding: 15px; }
        }
    </style>
</head>
<body>

    <div class="test-card">
        <div class="domain-badge">janejavier.com</div>
        <h1>Hello! This is my website.</h1>
        <p>Testing mobile responsiveness and deployment systems for my future engineering portfolio layout.</p>
        
        <div class="status-indicator">
            <span class="dot"></span> Local Server Active
        </div>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jane Frances Adolar Javier | Computer Engineer</title>
    
    <!-- FAVICON ICON: Custom bold white 'JJ' inside a smooth Apple-blue rounded square -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%230066cc%22/><text x=%2250%%22 y=%2265%%22 font-family=%22-apple-system, BlinkMacSystemFont, sans-serif%22 font-weight=%22700%22 font-size=%2250%22 fill=%22%23ffffff%22 text-anchor=%22middle%22>JJ</text></svg>">

    <style>
        :root {
            --apple-black: #1d1d1f;
            --apple-dark-gray: #424245;
            --apple-light-gray: #f5f5f7;
            --apple-blue: #0066cc;
            --border: #d2d2d7;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            color: var(--apple-black);
            background-color: #ffffff;
            overflow-x: hidden;
            letter-spacing: -0.01em;
        }

        /* Apple Glassmorphism Fixed Navigation Bar */
        nav {
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 100;
            padding: 14px 20px;
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-weight: 600;
            color: var(--apple-black);
            text-decoration: none;
            font-size: 1.05rem;
            letter-spacing: -0.02em;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            text-decoration: none;
            color: var(--apple-dark-gray);
            font-weight: 400;
            font-size: 0.85rem;
            transition: color 0.3s ease;
        }

        .nav-links a:hover {
            color: var(--apple-blue);
        }

        /* Reveal Scroll Animation Triggers */
        .reveal-section {
            opacity: 0;
            transform: translateY(40px) scale(0.98);
            transition: opacity 0.8s cubic-bezier(0.25, 1, 0.5, 1), 
                        transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .reveal-section.active {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        /* Interactive Profile Hero Section */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;
            background: radial-gradient(circle at bottom, #f5f5f7 0%, #ffffff 70%);
        }

        .hero h1 {
            font-size: 4rem;
            font-weight: 700;
            color: var(--apple-black);
            line-height: 1.05;
            letter-spacing: -0.05em;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: var(--apple-blue);
        }

        .tagline {
            font-size: 1.6rem;
            font-weight: 500;
            color: var(--apple-dark-gray);
            letter-spacing: -0.03em;
            margin-bottom: 25px;
            max-width: 600px;
        }

        .bio-text {
            font-size: 1.2rem;
            max-width: 720px;
            color: #6e6e73;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .section {
            padding: 90px 0;
        }

        .section h2 {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--apple-black);
            letter-spacing: -0.04em;
            margin-bottom: 45px;
            text-align: center;
        }

        /* Portfolio Engineering Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(440px, 1fr));
            gap: 30px;
        }

        @media (max-width: 550px) {
            .grid { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--apple-light-gray);
            border-radius: 22px;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .card:hover {
            transform: scale(1.015);
            box-shadow: 0 20px 40px rgba(0,0,0,0.04);
        }

        .card h3 {
            color: var(--apple-black);
            margin-bottom: 12px;
            font-size: 1.5rem;
            font-weight: 600;
            letter-spacing: -0.03em;
        }

        .card p {
            font-size: 1rem;
            color: #6e6e73;
            line-height: 1.55;
            margin-bottom: 25px;
        }

        .tag-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: #ffffff;
            color: var(--apple-black);
            border: 1px solid rgba(0,0,0,0.08);
            font-size: 0.82rem;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* Structured Education Layout */
        .edu-wrapper {
            background: var(--apple-light-gray);
            border-radius: 22px;
            padding: 40px;
        }

        .edu-item {
            padding: 24px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .edu-item:first-child { padding-top: 0; }
        .edu-item:not(:last-child) { border-bottom: 1px solid var(--border); }

        .edu-info h3 {
            color: var(--apple-black);
            font-size: 1.35rem;
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .edu-info p {
            color: #6e6e73;
            font-size: 1.05rem;
            margin-top: 4px;
        }

        .edu-date {
            font-size: 0.95rem;
            font-weight: 500;
            color: #1d1d1f;
            white-space: nowrap;
        }

        /* Control Action Buttons */
        .btn-group {
            display: flex;
            gap: 20px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--apple-blue);
            color: #fff;
            padding: 14px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn:hover {
            background: #0077ed;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-outline {
            background: transparent;
            color: var(--apple-blue);
        }

        .btn-outline:hover {
            background: transparent;
            text-decoration: underline;
        }

        /* Contact Network Channels */
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 20px;
        }

        .contact-method {
            background: var(--apple-light-gray);
            padding: 24px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--apple-black);
            font-weight: 500;
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .contact-method:hover {
            background: #e8e8ed;
        }

        .contact-method::after {
            content: "→";
            color: var(--apple-blue);
            font-weight: 600;
        }

        /* Mobile Screen Scalers */
        @media (max-width: 600px) {
            .nav-links { gap: 14px; }
            .nav-links a { font-size: 0.8rem; }
            .hero h1 { font-size: 2.6rem; letter-spacing: -0.04em; }
            .tagline { font-size: 1.25rem; }
            .bio-text { font-size: 1.1rem; }
            .section h2 { font-size: 2rem; }
            .grid { grid-template-columns: 1fr; }
            .card { padding: 30px; }
            .card h3 { font-size: 1.35rem; }
            .edu-item { flex-direction: column; align-items: flex-start; gap: 8px; }
            .btn-group { flex-direction: column; width: 100%; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

                <a href="#about">Intro</a>
                <a href="#portfolio">Portfolio</a>
                <a href="#education">Education</a>
                <a href="#contact">Contact</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <!-- Section 1: Introduction (Hero Panel) -->
